<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#c40000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>يامن الكابتن ⚽</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23c40000'/%3E%3Ctext x='50' y='68' font-size='50' text-anchor='middle' fill='white' font-family='Arial' font-weight='900'%3E17%3C/text%3E%3C/svg%3E">
<style>
:root{
  --red:#c40000; --red2:#ff2a2a; --redDark:#7d0000; --white:#fff;
  --grass:#2f9d46; --grass2:#28893c; --ink:#1d1d1d; --gold:#ffc400;
  --jersey:#d50000; --jnum:#ffffff;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:"Noto Sans Arabic","Noto Naskh Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  background:var(--grass) repeating-linear-gradient(90deg,var(--grass) 0 70px,var(--grass2) 70px 140px);
  color:var(--ink); direction:rtl; overflow:hidden;
  -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none;
  touch-action:manipulation; -webkit-touch-callout:none;
}
button{font-family:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.screen{position:fixed;inset:0;display:none;flex-direction:column;overflow-y:auto;overflow-x:hidden;
  padding:max(8px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom))}
.screen.active{display:flex}
.ltr{direction:ltr;unicode-bidi:isolate}

/* ---------- generic ---------- */
.title{color:#fff;font-weight:900;text-align:center;margin:6px 0;font-size:clamp(30px,8vw,54px);
  text-shadow:0 4px 0 var(--redDark),0 6px 14px rgba(0,0,0,.35)}
.pill{background:#fff;border-radius:999px;padding:6px 14px;font-weight:900;font-size:22px;box-shadow:0 3px 0 rgba(0,0,0,.2);white-space:nowrap}
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:0;border-radius:22px;font-weight:900;font-size:24px;padding:14px 22px;color:#fff;background:var(--red);
  box-shadow:0 6px 0 var(--redDark);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--redDark)}
.btn.white{background:#fff;color:var(--red);box-shadow:0 6px 0 #c9c9c9}
.btn.gray{background:#607d8b;box-shadow:0 6px 0 #37474f}
.btn.small{font-size:18px;padding:10px 16px;border-radius:16px}
.icon-btn{border:0;background:#fff;border-radius:50%;width:58px;height:58px;font-size:30px;box-shadow:0 4px 0 rgba(0,0,0,.25);
  display:flex;align-items:center;justify-content:center;flex:none}
.icon-btn:active{transform:translateY(3px)}
.topbar{display:flex;align-items:center;gap:8px;min-height:60px}

/* ---------- intro ---------- */
#intro{align-items:center;justify-content:center;text-align:center;gap:10px;
  background:radial-gradient(circle at 50% 30%,#ff3b3b,#c40000 55%,#7d0000)}
#intro .sub{color:#fff;font-size:22px;font-weight:700;opacity:.95}
#intro .hero{width:min(46vw,210px);height:auto}
#startBtn{font-size:34px;padding:18px 40px;background:#fff;color:var(--red);box-shadow:0 7px 0 #bbb;border-radius:30px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}

/* ---------- home ---------- */
#home .hero-wrap{display:flex;align-items:flex-end;justify-content:center;gap:8px}
#home .hero{width:min(30vw,140px);height:auto;cursor:pointer}
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px 12px;margin:16px 0 14px}
.stage-card{border:0;border-radius:24px;padding:12px 10px 14px;color:#fff;font-weight:900;font-size:21px;position:relative;
  display:flex;flex-direction:column;align-items:center;gap:6px;min-height:138px;justify-content:center;
  box-shadow:0 7px 0 rgba(0,0,0,.3);border:4px solid #fff}
.stage-card:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.3)}
.stage-card .ic{font-size:40px;background:#fff;color:#222;border-radius:18px;padding:2px 14px;min-width:96px;line-height:1.35}
.stage-card .cups{position:absolute;top:-18px;left:-6px;font-size:16px;font-weight:900;background:var(--gold);color:#4a2c00;border:3px solid #fff;border-radius:14px;padding:1px 9px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.home-nav{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:auto}
.home-nav .btn{font-size:clamp(15px,4vw,20px);padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.home-nav .btn span{font-size:32px}

/* ---------- play ---------- */
#play{padding-left:8px;padding-right:8px;gap:6px}
#dots{flex:1;display:flex;gap:3px;justify-content:center;flex-wrap:wrap}
#dots i{width:clamp(16px,4.6vw,24px);height:clamp(16px,4.6vw,24px);border-radius:50%;background:rgba(255,255,255,.35);border:2px solid #fff;font-style:normal;
  font-size:13px;display:flex;align-items:center;justify-content:center}
#dots i.cur{background:var(--gold);transform:scale(1.2)}
#dots i.goal{background:#fff}
.scene-wrap{position:relative;border-radius:18px;overflow:hidden;background:#2f9d46;flex:none;border:3px solid #fff;
  box-shadow:0 4px 12px rgba(0,0,0,.25)}
#scene{display:block;width:100%;height:clamp(150px,31vh,300px)}
#banner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;
  font-weight:900;font-size:clamp(30px,8vw,56px);color:#fff;text-align:center;opacity:0;transition:opacity .2s;
  text-shadow:0 3px 0 var(--redDark),0 0 16px rgba(0,0,0,.6)}
#banner.show{opacity:1;animation:pop .45s}
#banner.mode{font-size:clamp(26px,7vw,48px);background:rgba(0,0,0,.25)}
#banner.save{color:#fffde7;text-shadow:0 3px 0 #1565c0,0 0 16px rgba(0,0,0,.6)}
#banner .rev{font-size:.62em;background:rgba(255,255,255,.95);color:#222;text-shadow:none;border-radius:16px;padding:2px 16px;margin-top:6px}
#banner .rev b{color:var(--red)}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.qcard{background:#fff;border-radius:22px;padding:10px 12px;flex:1;min-height:120px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;box-shadow:0 5px 0 rgba(0,0,0,.18);position:relative;overflow:auto}
#qtext{font-size:clamp(22px,5.6vw,34px);font-weight:900;text-align:center;line-height:1.35}
#qtext bdi{color:#1565c0}
#qvisual{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;max-width:100%}
#replayBtn{background:var(--gold)}
.speak-hint{position:absolute;top:6px;left:8px;font-size:26px;border:0;background:#fff3c4;border-radius:50%;width:46px;height:46px}
#opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:none;padding-bottom:4px}
.opt{border:5px solid #fff;border-radius:24px;min-height:clamp(92px,15vh,140px);font-size:clamp(40px,11vw,70px);font-weight:900;
  display:flex;align-items:center;justify-content:center;color:#222;box-shadow:0 7px 0 rgba(0,0,0,.28);padding:6px;transition:transform .1s, opacity .2s}
.opt:nth-child(1){background:#ffd6d6;border-color:#e53935}
.opt:nth-child(2){background:#d8ecff;border-color:#1e88e5}
.opt:nth-child(3){background:#fff1bf;border-color:#f9a825}
.opt:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.opt[disabled]{opacity:.3;filter:grayscale(1);transform:scale(.92)}
.opt.right{animation:glow .6s 2;background:#c8f7c5!important;border-color:#2e7d32!important}
@keyframes glow{50%{transform:scale(1.08)}}
.opt .emo{font-size:clamp(46px,12vw,76px);line-height:1}
.opt svg{width:clamp(64px,17vw,104px);height:clamp(64px,17vw,104px)}
.swatch{display:inline-block;width:clamp(60px,16vw,96px);height:clamp(60px,16vw,96px);border-radius:30% 45% 35% 50%;border:3px solid rgba(0,0,0,.2)}
.big-letter{font-size:1em;line-height:1}
.en-letter{font-family:"Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif;direction:ltr}
.vis-xl{font-size:clamp(70px,20vw,120px);line-height:1;font-weight:900}
.vis-word{font-size:clamp(46px,12vw,72px);font-weight:900;color:#1565c0;font-family:"Trebuchet MS",Arial,sans-serif;direction:ltr}
.balls{display:grid;grid-template-columns:repeat(5,auto);gap:4px 6px;direction:rtl}
.balls svg,.grp svg{width:clamp(26px,7vw,40px);height:clamp(26px,7vw,40px)}
.balls .gap{grid-column:1/-1;height:2px}
.grp{display:flex;flex-wrap:wrap;gap:3px;max-width:clamp(120px,34vw,220px);justify-content:center;padding:6px;border:3px dashed #bbb;border-radius:16px}
.grp .gone{position:relative;opacity:.35}
.grp .gone::after{content:"✖";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#e53935;font-size:clamp(22px,6vw,34px);font-weight:900;opacity:1}
.op{font-size:clamp(36px,9vw,56px);font-weight:900;color:var(--red)}
.eq{font-size:clamp(30px,7vw,44px);font-weight:900;direction:rtl}
.numline{display:flex;gap:10px;direction:rtl}
.numline span{min-width:clamp(70px,18vw,104px);height:clamp(70px,18vw,104px);border:4px solid #1565c0;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:clamp(40px,10vw,64px);font-weight:900}
.numline.seq span{min-width:clamp(52px,13vw,84px);height:clamp(52px,13vw,84px);font-size:clamp(28px,7vw,46px)}
.word-opt{font-size:clamp(26px,7.5vw,46px);line-height:1.2}
.pat{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;direction:rtl}
.pat svg{width:clamp(40px,10vw,64px);height:clamp(40px,10vw,64px)}
.pat .pq{width:clamp(40px,10vw,64px);height:clamp(40px,10vw,64px);border:3px dashed #e53935;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;color:#e53935}
.shp{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:min(92vw,420px)}
.shp svg{width:clamp(36px,9vw,54px);height:clamp(36px,9vw,54px)}
.stage-card .lvl{font-size:15px;background:rgba(0,0,0,.22);border-radius:10px;padding:1px 10px}
.numline span.q{border-style:dashed;color:#e53935;border-color:#e53935}

/* ---------- player animation helpers ---------- */
.anim{transform-box:fill-box;transform-origin:50% 50%}
#jc{transform-box:fill-box;transform-origin:50% 50%}
.yp .armL,.yp .armR{transform-box:fill-box;transform-origin:50% 8%;transition:transform .3s}
.yp.cheer .armL{transform:rotate(150deg)} .yp.cheer .armR{transform:rotate(-150deg)}
.yp.plane .armL{transform:rotate(90deg)} .yp.plane .armR{transform:rotate(-90deg)}

/* ---------- overlay / modal ---------- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.show{display:flex}
.box{background:#fff;border-radius:26px;padding:20px;max-width:440px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.box h2{margin:4px 0 8px;font-size:30px}
.box p{font-size:20px;margin:8px 0}
#gate{z-index:55}
#gateIn{font-size:34px;width:160px;text-align:center;border:3px solid #ccc;border-radius:16px;padding:6px;font-family:inherit;direction:ltr}
#gateErr{color:#c62828;min-height:24px;font-size:18px}
#rest .box{background:linear-gradient(#fff,#ffecec)}
#rest .big{font-size:80px;margin:0}
#endModal .cup svg{width:150px;height:150px;animation:pop .7s}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-150%);background:#fff;border:4px solid var(--gold);
  border-radius:20px;padding:10px 18px;font-size:22px;font-weight:900;z-index:60;transition:transform .35s;box-shadow:0 6px 18px rgba(0,0,0,.35);text-align:center;max-width:92vw}
#toast.show{transform:translateX(-50%) translateY(0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
#fx i{position:absolute;display:block;border-radius:2px}

/* ---------- cabinet ---------- */
.cab{background:linear-gradient(#8d5a2b,#6d4321);border:8px solid #4e2f14;border-radius:22px;padding:10px;display:flex;flex-direction:column;gap:12px}
.shelf{background:rgba(0,0,0,.18);border-radius:14px;padding:8px 10px 0;border-bottom:10px solid #c48a4d}
.shelf h3{margin:0 0 4px;color:#fff;font-size:20px}
.shelf .cups{display:flex;flex-wrap:wrap;gap:4px;min-height:64px;align-items:flex-end}
.shelf .cups svg{width:56px;height:60px}
.shelf .empty{color:#ffe0b2;font-size:17px;padding:10px 0}
.shelf .count{color:#fff;font-weight:900;font-size:22px;margin-inline-start:6px}

/* ---------- locker ---------- */
.locker h3{color:#fff;font-size:24px;margin:12px 4px 6px;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.item{border:4px solid #fff;background:#fff;border-radius:20px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:900;font-size:17px;position:relative;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.item svg{width:70px;height:80px}
.item .ball-prev svg{width:62px;height:62px}
.item .em{font-size:46px;line-height:80px}
.item.on{border-color:var(--gold);background:#fff8dc;box-shadow:0 0 0 4px var(--gold)}
.item.locked{opacity:.75;background:#e0e0e0}
.item.locked>*:not(.lock){filter:grayscale(1) blur(.5px)}
.item .lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:30px;color:#333}
.item .lock small{font-size:17px;background:#fff;border-radius:10px;padding:0 8px}
#lockerHero{display:flex;justify-content:center}
#lockerHero svg{width:120px;height:150px}

/* ---------- parent ---------- */
#parent{background:#f3f5f7;color:#222}
#parent .card{background:#fff;border-radius:18px;padding:14px;margin:8px 0;box-shadow:0 2px 8px rgba(0,0,0,.08)}
#parent h2{margin:4px 0;font-size:26px}
#parent h3{margin:0 0 8px;font-size:21px}
#parent label{font-size:18px;font-weight:700}
#parent select{font-size:18px;padding:6px 10px;border-radius:10px;font-family:inherit}
.stat{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:17px}
.stat .nm{width:150px;flex:none;font-weight:700}
.bar{flex:1;height:18px;background:#eceff1;border-radius:9px;overflow:hidden}
.bar b{display:block;height:100%;background:linear-gradient(90deg,#43a047,#9ccc65);border-radius:9px}
.stat .pc{width:92px;text-align:left;flex:none;font-weight:700;direction:ltr}
.mist{display:flex;flex-wrap:wrap;gap:6px}
.mist span{background:#ffebee;border:2px solid #ef9a9a;border-radius:12px;padding:3px 10px;font-size:17px}
.kv{display:flex;flex-wrap:wrap;gap:8px}
.kv div{background:#f1f8e9;border-radius:12px;padding:8px 12px;font-size:17px}
.kv b{font-size:22px}
.note{font-size:15px;color:#555}
.warn{background:#fff3e0;border:2px solid #ffb74d;border-radius:12px;padding:8px;font-size:16px}
</style>
</head>
<body>

<!-- ============ INTRO ============ -->
<section id="intro" class="screen active">
  <div class="title">يامن الكابتن ⚽</div>
  <div id="introHero"></div>
  <div class="sub">جاوب صح… وشوط جون! 🥅</div>
  <button id="startBtn" class="btn">يلا نلعب ⚽</button>
  <div class="sub" id="ver" style="font-size:15px;opacity:.85">الإصدار ٣ · ٥ ألعاب · ٣ مستويات</div>
</section>

<!-- ============ HOME ============ -->
<section id="home" class="screen">
  <div class="topbar">
    <span class="pill">⭐ <span id="hStars">0</span></span>
    <span class="pill">🏆 <span id="hCups">0</span></span>
    <span class="spacer"></span>
    <button class="icon-btn" id="soundToggle" aria-label="الصوت">🔊</button>
  </div>
  <div class="hero-wrap"><div class="title" style="font-size:clamp(28px,7vw,46px)">يامن الكابتن</div><div id="homeHero"></div></div>
  <div class="stages" id="stages"></div>
  <div class="home-nav">
    <button class="btn" id="goCabinet"><span>🏆</span>دولاب البطولات</button>
    <button class="btn white" id="goLocker"><span>👕</span>غرفة اللبس</button>
    <button class="btn gray" id="goParent"><span>👨</span>ولي الأمر</button>
  </div>
</section>

<!-- ============ PLAY ============ -->
<section id="play" class="screen">
  <div class="topbar">
    <button class="icon-btn" id="quitBtn" aria-label="الرئيسية">🏠</button>
    <div id="dots"></div>
    <button class="icon-btn" id="replayBtn" aria-label="اسمع السؤال تاني">🔊</button>
  </div>
  <div class="scene-wrap"><svg id="scene" viewBox="0 0 400 250" preserveAspectRatio="xMidYMid meet"></svg><div id="banner"></div></div>
  <div class="qcard"><div id="qtext"></div><div id="qvisual"></div></div>
  <div id="opts"></div>
</section>

<!-- ============ CABINET ============ -->
<section id="cabinet" class="screen">
  <div class="topbar"><button class="icon-btn back" aria-label="رجوع">🏠</button><div class="title" style="flex:1;font-size:clamp(26px,7vw,42px)">دولاب البطولات 🏆</div></div>
  <div class="cab" id="cabBody"></div>
</section>

<!-- ============ LOCKER ============ -->
<section id="locker" class="screen">
  <div class="topbar"><button class="icon-btn back" aria-label="رجوع">🏠</button><div class="title" style="flex:1;font-size:clamp(26px,7vw,42px)">غرفة اللبس 👕</div><span class="pill">⭐ <span id="lStars">0</span></span></div>
  <div id="lockerHero"></div>
  <div class="locker" id="lockerBody"></div>
</section>

<!-- ============ PARENT ============ -->
<section id="parent" class="screen">
  <div class="topbar"><button class="icon-btn back" aria-label="رجوع" style="background:#eceff1">🏠</button><h2 style="flex:1">صفحة ولي الأمر 👨</h2></div>
  <div id="parentBody"></div>
</section>

<!-- ============ MODALS ============ -->
<div id="gate" class="modal"><div class="box">
  <h2>للكبار بس 👨</h2>
  <p>حل المسألة دي عشان تدخل:</p>
  <p id="gateQ" style="font-size:34px;font-weight:900;direction:ltr"></p>
  <input id="gateIn" type="tel" inputmode="numeric" autocomplete="off">
  <div id="gateErr"></div>
  <div class="row"><button class="btn small" id="gateOk">دخول</button><button class="btn small gray" id="gateNo">رجوع</button></div>
</div></div>

<div id="rest" class="modal"><div class="box">
  <p class="big">💪😴</p>
  <h2>وقت الراحة يا كابتن 💪</h2>
  <p>لعبت كتير النهارده يا بطل! اشرب مية وريّح عينيك، ونكمل بكرة ⚽</p>
  <button class="btn small gray" id="restParent">ولي الأمر</button>
</div></div>

<div id="endModal" class="modal"><div class="box">
  <div class="cup" id="endCup"></div>
  <h2 id="endTitle">كسبت الكاس! 🏆</h2>
  <p id="endStars"></p>
  <div class="row"><button class="btn" id="endAgain">العب تاني ⚽</button><button class="btn white" id="endHome">الملاعب 🏟️</button></div>
</div></div>

<div id="toast"></div>
<div id="fx"></div>

<script>
(function(){
"use strict";

/* =========================================================
   Helpers
   ========================================================= */
const $ = s => document.querySelector(s);
const rnd = n => Math.floor(Math.random() * n);
const randInt = (a, b) => a + rnd(b - a + 1);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sample = (arr, k, excl) => shuffle(arr.filter(x => !excl || !excl(x))).slice(0, k);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const AR_DIG = '٠١٢٣٤٥٦٧٨٩';
function fmt(n){ const s = String(n); return S.settings.digits === 'ar' ? s.replace(/\d/g, d => AR_DIG[d]) : s; }
function todayKey(){ const d = new Date(); return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate(); }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* near numbers for distractors */
function nearNums(ans, min, max, k){
  k = k || 2;
  const out = new Set();
  const c = shuffle([ans+1, ans-1, ans+2, ans-2, ans+3, ans-3].filter(x => x >= min && x <= max && x !== ans));
  for (const x of c){ if (out.size >= k) break; out.add(x); }
  let guard = 0;
  while (out.size < k && guard++ < 100){ const x = randInt(min, max); if (x !== ans) out.add(x); }
  return [...out];
}

/* =========================================================
   Sound (Web Audio API, no files)
   ========================================================= */
const Snd = {
  ctx: null,
  init(){
    try {
      if (!this.ctx){ const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    } catch(e){}
  },
  ok(){ return this.ctx && S.settings.sound; },
  tone(f, t, dur, type, vol, f2){
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
  },
  noise(dur){
    const c = this.ctx, b = c.createBuffer(1, Math.floor(c.sampleRate * dur), c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(); s.buffer = b; return s;
  },
  tap(){ if (!this.ok()) return; this.tone(660, this.ctx.currentTime, 0.07, 'sine', 0.08); },
  kick(){ if (!this.ok()) return; const t = this.ctx.currentTime; this.tone(160, t, 0.18, 'sine', 0.7, 45);
    const n = this.noise(0.05), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain(); f.type='lowpass'; f.frequency.value=1500;
    g.gain.value = 0.25; n.connect(f); f.connect(g); g.connect(this.ctx.destination); n.start(t); },
  cheer(){ if (!this.ok()) return; const c = this.ctx, t = c.currentTime;
    [[900,0.32],[2200,0.14]].forEach(([fr, v]) => {
      const n = this.noise(2.6), f = c.createBiquadFilter(), g = c.createGain();
      f.type = 'bandpass'; f.frequency.value = fr; f.Q.value = 0.6;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.3);
      g.gain.setValueAtTime(v, t + 1.6); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.6);
      n.connect(f); f.connect(g); g.connect(c.destination); n.start(t);
    });
    const notes = [523, 523, 523, 659, 784]; const tm = [0.15, 0.4, 0.65, 0.9, 1.15];
    notes.forEach((nf, i) => this.tone(nf, t + tm[i], 0.22, 'triangle', 0.16));
  },
  save(){ if (!this.ok()) return; const c = this.ctx, t = c.currentTime;
    const n = this.noise(0.12), f = c.createBiquadFilter(), g = c.createGain(); f.type = 'lowpass'; f.frequency.value = 500;
    g.gain.setValueAtTime(0.3, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12); n.connect(f); f.connect(g); g.connect(c.destination); n.start(t);
    this.tone(392, t + 0.15, 0.25, 'sine', 0.06); },
  whistle(){ if (!this.ok()) return; const c = this.ctx, t = c.currentTime, o = c.createOscillator(), l = c.createOscillator(), lg = c.createGain(), g = c.createGain();
    o.frequency.value = 2700; l.frequency.value = 32; lg.gain.value = 140; l.connect(lg); lg.connect(o.frequency);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.09, t + 0.02); g.gain.setValueAtTime(0.09, t + 0.35); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
    o.connect(g); g.connect(c.destination); o.start(t); l.start(t); o.stop(t + 0.5); l.stop(t + 0.5); },
  fanfare(){ if (!this.ok()) return; const t = this.ctx.currentTime;
    [523, 659, 784, 1046, 784, 1046].forEach((f, i) => this.tone(f, t + i * 0.16, i === 5 ? 0.7 : 0.2, 'triangle', 0.2)); },
  clang(){ if (!this.ok()) return; const t = this.ctx.currentTime; this.tone(880, t, 0.5, 'triangle', 0.12); this.tone(1320, t, 0.4, 'sine', 0.06); },
  bounce(){ if (!this.ok()) return; this.tone(240, this.ctx.currentTime, 0.1, 'sine', 0.3, 110); },
  sparkle(){ if (!this.ok()) return; const t = this.ctx.currentTime;
    [1046, 1318, 1568, 2093].forEach((f, i) => this.tone(f, t + i * 0.08, 0.25, 'sine', 0.12)); }
};

/* =========================================================
   Speech (Web Speech API, ar-EG)
   ========================================================= */
const Speech = {
  supported: 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window,
  ar: null, en: null, token: 0,
  pickVoices(){
    if (!this.supported) return;
    const vs = speechSynthesis.getVoices() || [];
    const norm = v => (v.lang || '').replace('_', '-').toLowerCase();
    this.ar = vs.find(v => norm(v) === 'ar-eg') || vs.find(v => norm(v).startsWith('ar')) || null;
    this.en = vs.find(v => norm(v) === 'en-us') || vs.find(v => norm(v).startsWith('en')) || null;
  },
  init(){
    if (!this.supported) return;
    this.pickVoices();
    try { speechSynthesis.addEventListener('voiceschanged', () => this.pickVoices()); } catch(e){ speechSynthesis.onvoiceschanged = () => this.pickVoices(); }
  },
  stop(){ this.token++; if (this.supported) try { speechSynthesis.cancel(); } catch(e){} },
  /* parts: string | [{t, en?}] ; returns promise resolving when finished (or timeout) */
  say(parts){
    if (typeof parts === 'string') parts = [{ t: parts }];
    if (!this.supported || !S.settings.voice || !parts || !parts.length) return Promise.resolve();
    this.stop();
    const my = this.token;
    const total = parts.reduce((a, p) => a + p.t.length, 0);
    return new Promise(resolve => {
      let done = false; const fin = () => { if (!done){ done = true; resolve(); } };
      setTimeout(fin, 1500 + total * 110);              // safety: never block the game
      setTimeout(() => {
        if (my !== this.token) return fin();
        parts.forEach((p, i) => {
          const u = new SpeechSynthesisUtterance(p.t);
          u.lang = p.en ? 'en-US' : 'ar-EG';
          const v = p.en ? this.en : this.ar; if (v) u.voice = v;
          u.rate = p.en ? 0.8 : 0.92; u.pitch = 1.1; u.volume = 1;
          if (i === parts.length - 1){ u.onend = fin; u.onerror = fin; }
          speechSynthesis.speak(u);
        });
      }, 80);
    });
  }
};
Speech.init();
window.__speech = Speech;

function ballInner(st, r){
  st = st || ballStyle(); r = r || 11;
  const pc = i => st.patch[i % st.patch.length];
  const k = r / 11;
  const pent = (cx, cy, s, rot) => { let p = []; for (let i = 0; i < 5; i++){ const a = (rot + i * 72 - 90) * Math.PI / 180; p.push((cx + s * Math.cos(a)).toFixed(2) + ',' + (cy + s * Math.sin(a)).toFixed(2)); } return p.join(' '); };
  let out = `<circle r="${r}" fill="${st.base}" stroke="#333" stroke-width="${0.9*k}"/>`;
  out += `<polygon points="${pent(0, 0, 4 * k, 0)}" fill="${pc(0)}"/>`;
  for (let i = 0; i < 5; i++){
    const a = (i * 72 - 90) * Math.PI / 180;
    const x1 = 4 * k * Math.cos(a), y1 = 4 * k * Math.sin(a), x2 = 8.3 * k * Math.cos(a), y2 = 8.3 * k * Math.sin(a);
    out += `<line x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}" stroke="#444" stroke-width="${0.7*k}"/>`;
    out += `<polygon points="${pent(x2 * 1.12, y2 * 1.12, 2.4 * k, i * 72 + 36)}" fill="${pc(i + 1)}"/>`;
  }
  out += `<ellipse cx="${-3.5*k}" cy="${-5*k}" rx="${3*k}" ry="${1.6*k}" fill="#fff" opacity=".45"/>`;
  return out;
}
function ballSVG(st){ return `<svg viewBox="-12 -12 24 24">${ballInner(st, 11)}</svg>`; }

/* two wrong letters; from level 2 the first one is a look-alike (ب/ت/ث …) when there is one */
function arWrong(L, lvl){
  const fam = AR_FAMILIES.find(f => f.includes(L.ch)), out = [];
  if (lvl >= 2 && fam) shuffle(fam.filter(c => c !== L.ch)).slice(0, lvl >= 3 ? 2 : 1).forEach(c => out.push(AR.find(a => a.ch === c)));
  sample(AR, 2, x => x.ch === L.ch || out.includes(x)).forEach(x => { if (out.length < 2) out.push(x); });
  return out;
}

  const c = shuffle([reverseNum(ans), ans + 10, ans - 10, ans + 1, ans - 1].filter(x => x >= min && x <= max && x !== ans && x >= 0));
  const out = [...new Set(c)].slice(0, 2);
  nearNums(ans, min, max).forEach(x => { if (out.length < 2 && !out.includes(x)) out.push(x); });
  return out;
}

    const o = shuffle([...new Set([ans + step, ans - step, ans + 1, ans - 1, ans + 10])].filter(x => x > 0 && x <= 100 && x !== ans && !seq.includes(x))).slice(0, 2);
    return { sub:'num', key:'nS' + a + ',' + step + ',' + miss, label:`العدّ بالـ${fmt(step)}`,
      text:'إيه الرقم الناقص؟', say:'بنعدّ… إيه الرقم الناقص؟', visual:`<div class="numline seq">${shown}</div>`,
      options:numOpts(ans, o.length === 2 ? o : nearNums(ans, 1, 100)), check:{ type:'seq', a, step, miss } };
  },
  /* tens and ones: ٤٣ فيها كام عشرة؟ / ١٥ = ١٠ + ؟ */
  numTens(lvl){
    const big = (lvl || 2) >= 3, n = big ? randInt(21, 98) : randInt(11, 19);
    const kind = big ? pick(['tens', 'ones', 'add']) : 'add', T = Math.floor(n / 10) * 10;
    const ans = kind === 'tens' ? Math.floor(n / 10) : n % 10;
    const text = kind === 'tens' ? `الرقم ${fmt(n)} فيه كام <b>عشرة</b>؟` : kind === 'ones' ? `الرقم ${fmt(n)} فيه كام <b>آحاد</b>؟` : `<span class="eq">${fmt(n)} = ${fmt(T)} + ؟</span>`;
    const say = kind === 'tens' ? `الرقم ${n} فيه كام عشرة؟` : kind === 'ones' ? `الرقم ${n} فيه كام آحاد؟` : `${n} يساوي ${T} زائد كام؟`;
    const wrong = kind === 'add' ? nearNums(ans, 0, 9) : shuffle([n % 10 === ans ? Math.floor(n / 10) : n % 10, ans + 1, ans - 1].filter((x, k, a) => x >= 0 && x <= 9 && x !== ans && a.indexOf(x) === k)).slice(0, 2);
    return { sub:'num', key:'nT' + kind + n, label: kind === 'add' ? `${fmt(n)} = ${fmt(T)} + ؟` : `عشرات وآحاد ${fmt(n)}`,
      text, say, visual:'', options:numOpts(ans, wrong.length === 2 ? wrong : nearNums(ans, 0, 9)), check:{ type:'tens', n, kind } };
  },
  /* ---- Maths ---- */
  mathAdd(lvl){
    const mx = MATHMAX[lvl || 2];
    const a = randInt(mx > 10 ? 3 : 1, mx - 1), b = randInt(1, mx - a), ans = a + b;
    return { sub:'math', key:'mA' + a + '+' + b, label:`${fmt(a)} + ${fmt(b)}`,
      text:`<span class="eq">${fmt(a)} + ${fmt(b)} = ؟</span>`, say:`${a} كورة… زائد ${b} كورة… يساوي كام؟`,
      visual: ans <= 20 ? `${ballGroup(a)}<span class="op">+</span>${ballGroup(b)}` : '',
      options:numOpts(ans, nearNums(ans, 0, mx)), check:{ type:'add', a, b } };
  },
  mathSub(lvl){
    const mx = MATHMAX[lvl || 2];
    const a = randInt(mx > 10 ? 8 : 2, mx), b = randInt(1, a - 1), ans = a - b;
    return { sub:'math', key:'mS' + a + '-' + b, label:`${fmt(a)} − ${fmt(b)}`,
      text:`<span class="eq">${fmt(a)} − ${fmt(b)} = ؟</span>`, say:`معانا ${a} كورة… شيلنا ${b}… فاضل كام؟`,
      visual:ballGroup(a, b), options:numOpts(ans, nearNums(ans, 0, mx)), check:{ type:'sub', a, b } };
  },
  /* missing number: ٣ + ؟ = ٨  /  ١٢ − ؟ = ٧ */
  mathMissing(lvl){
    const mx = MATHMAX[lvl || 2], plus = Math.random() < .6;
    if (plus){
      const c = randInt(4, mx), a = randInt(1, c - 1), ans = c - a;
      return { sub:'math', key:'mM+' + a + '=' + c, label:`${fmt(a)} + ؟ = ${fmt(c)}`,
        text:`<span class="eq">${fmt(a)} + <span style="color:#e53935">؟</span> = ${fmt(c)}</span>`, say:`${a} زائد كام… يساوي ${c}؟`,
        visual: c <= 20 ? `${ballGroup(a)}<span class="op">+</span><span class="op" style="color:#e53935">؟</span>` : '',
        options:numOpts(ans, nearNums(ans, 0, mx)), check:{ type:'missAdd', a, c } };
    }
    const a = randInt(5, mx), c = randInt(1, a - 1), ans = a - c;
    return { sub:'math', key:'mM-' + a + '=' + c, label:`${fmt(a)} − ؟ = ${fmt(c)}`,
      text:`<span class="eq">${fmt(a)} − <span style="color:#e53935">؟</span> = ${fmt(c)}</span>`, say:`${a} ناقص كام… يساوي ${c}؟`,
      visual:'', options:numOpts(ans, nearNums(ans, 0, mx)), check:{ type:'missSub', a, c } };
  },
  /* three numbers: ٢ + ٥ + ٣ */
  mathThree(){
    const a = randInt(1, 6), b = randInt(1, 6), c = randInt(1, 18 - a - b > 6 ? 6 : 18 - a - b), ans = a + b + c;
    return { sub:'math', key:'m3' + a + b + c, label:`${fmt(a)} + ${fmt(b)} + ${fmt(c)}`,
      text:`<span class="eq">${fmt(a)} + ${fmt(b)} + ${fmt(c)} = ؟</span>`, say:`${a} زائد ${b} زائد ${c}… يساوي كام؟`,
      visual:`${ballGroup(a)}<span class="op">+</span>${ballGroup(b)}<span class="op">+</span>${ballGroup(c)}`,
      options:numOpts(ans, nearNums(ans, 0, 20)), check:{ type:'add3', a, b, c } };
  },
  /* tens: ٢٠ + ٣٠ */
  mathTens(){
    const plus = Math.random() < .6, a = 10 * randInt(plus ? 1 : 3, plus ? 8 : 9), b = 10 * randInt(1, plus ? 9 - a / 10 : a / 10 - 1), ans = plus ? a + b : a - b;
    const o = shuffle([ans + 10, ans - 10, ans + 1, plus ? a + b / 10 : ans + 20].filter(x => x >= 0 && x !== ans)).slice(0, 2);
    return { sub:'math', key:'mT' + a + (plus ? '+' : '-') + b, label:`${fmt(a)} ${plus ? '+' : '−'} ${fmt(b)}`,
      text:`<span class="eq">${fmt(a)} ${plus ? '+' : '−'} ${fmt(b)} = ؟</span>`, say:`${a} ${plus ? 'زائد' : 'ناقص'} ${b}… يساوي كام؟`,
      visual:'', options:numOpts(ans, o), check:{ type: plus ? 'add' : 'sub', a, b } };
  },
  /* short word problems, read aloud */
  mathStory(){
    const T = pick([
      { op:'+', t:(a, b) => `يامن جاب ${a} جون في الماتش الأول، و${b} جون في التاني. جاب كام جون؟` },
      { op:'+', t:(a, b) => `في الملعب ${a} لعيبة، ودخل ${b} لعيبة كمان. بقوا كام لعيب؟` },
      { op:'+', t:(a, b) => `يامن معاه ${a} نجمة، وكسب ${b} نجوم كمان. بقى معاه كام نجمة؟` },
      { op:'-', t:(a, b) => `مع يامن ${a} كورة، إدّى صاحبه ${b}. فضل معاه كام كورة؟` },
      { op:'-', t:(a, b) => `في الدولاب ${a} فانلة، يامن لبس ${b}. فضل كام فانلة؟` }
    ]);
    let a, b;
    if (T.op === '+'){ a = randInt(3, 12); b = randInt(2, 20 - a); } else { a = randInt(8, 20); b = randInt(2, a - 2); }
    const ans = T.op === '+' ? a + b : a - b, txt = T.t(a, b);
    return { sub:'math', key:'mW' + T.op + a + ',' + b, label:`مسألة: ${fmt(a)} ${T.op === '+' ? '+' : '−'} ${fmt(b)}`,
      text:`<span style="font-size:.8em">${txt.replace(/\d+/g, d => fmt(d))}</span>`, say:txt, visual:'⚽',
      options:numOpts(ans, nearNums(ans, 0, 20)), check:{ type: T.op === '+' ? 'add' : 'sub', a, b } };
  },
  /* ---- Shapes & colours ---- */
  shapeFind(){
    const keys = Object.keys(SHAPES), k = pick(keys), o = sample(keys, 2, x => x === k), col = pick(Object.keys(COLORS));
    return { sub:'shape', key:'sF' + k, label:'شكل ' + SHAPES[k].def,
      text:`فين ${SHAPES[k].def}؟`, say:`فين ${SHAPES[k].def}؟`, visual:'',
      options:[opt(shapeSVG(k, COLORS[col].hex), 1, k), ...o.map(x => opt(shapeSVG(x, COLORS[col].hex), 0, x))], check:{ type:'shape', k } };
  },
  colorFind(){
    const keys = Object.keys(COLORS), k = pick(keys), o = sample(keys, 2, x => x === k);
    return { sub:'shape', key:'cF' + k, label:'اللون ال' + COLORS[k].m,
      text:`فين اللون ال${COLORS[k].m}؟ 🎨`, say:`فين اللون ال${COLORS[k].m}؟`, visual:'',
      options:[opt(swatch(k), 1, k), ...o.map(x => opt(swatch(x), 0, x))], check:{ type:'color', k } };
  },
  colorObj(){
    const O = pick(OBJ_COLORS), o = sample(Object.keys(COLORS), 2, x => x === O.c);
    return { sub:'shape', key:'cO' + O.o, label:'لون ' + O.o,
      text:`${O.o} ${O.m ? 'لونه' : 'لونها'} إيه؟`, say:`${O.o} ${O.m ? 'لونه' : 'لونها'} إيه؟`,
      visual:`<span class="vis-xl">${O.e}</span>`,
      options:[opt(swatch(O.c), 1, O.c), ...o.map(x => opt(swatch(x), 0, x))], check:{ type:'objColor', o:O.o } };
  },
  shapeColor(){
    const sk = Object.keys(SHAPES), ck = Object.keys(COLORS);
    const s = pick(sk), c = pick(ck), s2 = pick(sk.filter(x => x !== s)), c2 = pick(ck.filter(x => x !== c));
    const adj = SHAPES[s].fem ? COLORS[c].f : COLORS[c].m;
    return { sub:'shape', key:'sC' + s + c, label:`${SHAPES[s].def} ال${adj}`,
      text:`فين ${SHAPES[s].def} ال${adj}؟`, say:`فين ${SHAPES[s].def} ال${adj}؟`, visual:'',
      options:[opt(shapeSVG(s, COLORS[c].hex), 1, s + '|' + c), opt(shapeSVG(s, COLORS[c2].hex), 0, s + '|' + c2), opt(shapeSVG(s2, COLORS[c].hex), 0, s2 + '|' + c)],
      check:{ type:'shapeColor', s, c } };
  },
  shapeReal(){
    const R = pick(REAL_SHAPES), o = sample(Object.keys(SHAPES), 2, x => x === R.s), col = COLORS.blue.hex;
    return { sub:'shape', key:'sR' + R.o, label:`شكل ${R.o}`,
      text:`${R.o} شكلها زي إيه؟`, say:`${R.o}… شكلها زي إيه؟`, visual:`<span class="vis-xl">${R.e}</span>`,
      options:[opt(shapeSVG(R.s, col), 1, R.s), ...o.map(x => opt(shapeSVG(x, col), 0, x))], check:{ type:'real', o:R.o } };
  },
  /* sides / corners */
  shapeSides(){
    const k = pick(Object.keys(SIDES)), what = pick(['أضلاع', 'أركان']), ans = SIDES[k];
    return { sub:'shape', key:'sS' + k + what, label:`${what} ${SHAPES[k].def}`,
      text:`${SHAPES[k].def} ليه كام ${what === 'أضلاع' ? 'ضلع' : 'ركن'}؟`, say:`${SHAPES[k].def} ليه كام ${what === 'أضلاع' ? 'ضلع' : 'ركن'}؟`,
      visual:shapeSVG(k, COLORS.blue.hex).replace('<svg', '<svg style="width:110px;height:110px"'),
      options:numOpts(ans, ans === 3 ? [4, 5] : [3, 5]), check:{ type:'sides', k } };
  },
  /* which shape has 3 sides / no corners */
  shapeBySides(){
    const c = pick([{ t:'أنهي شكل ليه ٣ أضلاع؟', s:'تلات أضلاع', k:'triangle' }, { t:'أنهي شكل ملوش ولا ركن؟', s:'ملوش ولا ركن', k:'circle' }]);
    const o = sample(Object.keys(SHAPES), 2, x => x === c.k), col = COLORS.green.hex;
    return { sub:'shape', key:'sB' + c.k, label:c.t,
      text:c.t, say: c.k === 'triangle' ? 'أنهي شكل ليه تلات أضلاع؟' : 'أنهي شكل ملوش ولا ركن؟', visual:'',
      options:[opt(shapeSVG(c.k, col), 1, c.k), ...o.map(x => opt(shapeSVG(x, col), 0, x))], check:{ type:'bySides', k:c.k } };
  },
  /* mixing colours */
  colorMix(){
    const M = pick(COLOR_MIX), o = sample(Object.keys(COLORS), 2, x => x === M.r || x === M.a || x === M.b);
    return { sub:'shape', key:'cM' + M.r, label:`${COLORS[M.a].m} + ${COLORS[M.b].m}`,
      text:`لو خلطنا ال${COLORS[M.a].m} وال${COLORS[M.b].m}… يطلع لون إيه؟`, say:`لو خلطنا اللون ال${COLORS[M.a].m} واللون ال${COLORS[M.b].m}… يطلع لون إيه؟`,
      visual:`${swatch(M.a)}<span class="op">+</span>${swatch(M.b)}<span class="op">=</span><span class="op" style="color:#e53935">؟</span>`,
      options:[opt(swatch(M.r), 1, M.r), ...o.map(x => opt(swatch(x), 0, x))], check:{ type:'mix', a:M.a, b:M.b } };
  },
  /* patterns: 🔴🔵🔴🔵 ؟ */
  shapePattern(lvl){
    const sk = Object.keys(SHAPES), ck = Object.keys(COLORS);
    const kinds = (lvl || 2) >= 3 ? ['AB', 'ABC', 'AAB', 'ABB'] : ['AB', 'AB', 'ABC'];
    const kind = pick(kinds), n = new Set(kind).size;
    const items = []; const ss = shuffle(sk), cc = shuffle(ck);
    for (let k = 0; k < n; k++) items.push({ s: ss[k], c: cc[k] });
    const unit = kind.split('').map(ch => items[ch.charCodeAt(0) - 65]);
    const shownN = randInt(unit.length + 1, Math.min(7, unit.length * 2 + 1));
    const seq = []; for (let k = 0; k < shownN; k++) seq.push(unit[k % unit.length]);
    const ans = unit[shownN % unit.length], key = x => x.s + '|' + x.c;
    const wrong = shuffle(items.filter(x => key(x) !== key(ans)).concat([{ s: ss[n], c: cc[n] }, { s: ans.s, c: cc[n] }])).filter((x, k, a) => a.findIndex(y => key(y) === key(x)) === k).slice(0, 2);
    const draw = x => shapeSVG(x.s, COLORS[x.c].hex);
    return { sub:'shape', key:'sP' + seq.map(key).join(','), label:`نمط ${kind}`,
      text:'إيه اللي ييجي بعد كده؟', say:'بص على الترتيب… إيه اللي ييجي بعد كده؟',
      visual:`<div class="pat">${seq.map(draw).join('')}<span class="pq">؟</span></div>`,
      options:[opt(draw(ans), 1, key(ans)), ...wrong.map(x => opt(draw(x), 0, key(x)))], check:{ type:'pattern', unit: unit.map(key), shown: shownN } };
  },
  /* count one shape inside a picture */
  shapeCount(){
    const sk = Object.keys(SHAPES), target = pick(sk), ans = randInt(2, 6), total = randInt(ans + 3, ans + 6);
    const items = []; for (let k = 0; k < ans; k++) items.push(target);
    while (items.length < total) items.push(pick(sk.filter(x => x !== target)));
    const pic = shuffle(items);
    return { sub:'shape', key:'sK' + target + pic.join(''), label:`عدّ ${SHAPES[target].def}`,
      text:`كام ${SHAPES[target].m} في الصورة؟`, say:`عدّ كويس… كام ${SHAPES[target].m} في الصورة؟`,
      visual:`<div class="shp">${pic.map(k => shapeSVG(k, COLORS[pick(Object.keys(COLORS))].hex)).join('')}</div>`,
      options:numOpts(ans, nearNums(ans, 1, 9)), check:{ type:'countShape', items:pic, target } };
  }
};

const LEVEL_NAMES = ['', 'سهل', 'متوسط', 'صعب'];
function levelFor(i){
  const d = S.settings.diff;
  if (d === 1 || d === 2 || d === 3) return d;
  return (S.level && S.level[STAGES[i].id]) || 2;
}

function makeRound(stageIdx, lvl){
  lvl = lvl || levelFor(stageIdx);
  const st = STAGES[stageIdx], gens = st.gens[lvl], seen = new Set(), qs = [];
  let guard = 0;
  while (qs.length < 10 && guard++ < 500){
    const q = GEN[pick(gens)](lvl);
    if (seen.has(q.key)) continue;
    seen.add(q.key); q.options = shuffle(q.options); qs.push(q);
  }
  return qs;
}

    win:['تمريرة حلوة وجوون! ⚽', 'أسيست عالمي يا يامن! 🎯', 'فريق بطل! ⚽'],
    winSay:['تمريرة حلوة وجوون!', 'أسيست عالمي يا يامن!', 'فريق بطل!'], miss:'قربت! جرب تاني 💪' },
  dribble: { title:'راوغ وعدّي! 🏃', say:'عدي بالكورة من البوابة اللي عند الإجابة الصح.',
    win:['راوغت وجبت جون! ⚽', 'مهارة عالية يا يامن! 🔥', 'محدش يقدر يوقفك! 🏃'],
    winSay:['راوغت وجبت جون!', 'مهارة عالية يا يامن!', 'محدش يقدر يوقفك!'], miss:'🚧 الكورة خبطت في القمع! جرب تاني 💪' },
  juggle: { title:'نطّط الكورة! 🤹', say:'يلا ننطط الكورة! جاوب صح.', miss:'قربت! جرب تاني 💪' }
};
const MODE_KEYS = Object.keys(MODES);
/* every round: all 5 game types, 2 questions each, in random order */
function roundModes(){ const out = []; shuffle(MODE_KEYS).forEach(m => out.push(m, m)); return out; }
const toParts = x => typeof x === 'string' ? [{ t:x }] : (x || []);

/* ---------- scene drawing ---------- */
function sceneDefs(){
  return `<defs>
    <pattern id="net" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 0 L8 8 M8 0 L0 8" stroke="#fff" stroke-width=".8" opacity=".75"/></pattern>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d0000"/><stop offset="1" stop-color="#b30000"/></linearGradient>
  </defs>`;
}
function sceneField(){
  let crowd = '';
  for (let i = 0; i < 46; i++){
    const x = 6 + i * 8.6 + (i % 2) * 2, y = 9 + (i % 3) * 5;
    crowd += `<circle cx="${x}" cy="${y}" r="3.3" fill="${i % 3 === 0 ? '#fff' : (i % 3 === 1 ? '#ff4d4d' : '#ffd6d6')}"/>`;
  }
  return `<rect width="400" height="250" fill="#34a64c"/>
  <rect y="28" width="400" height="30" fill="#2f9844"/><rect y="88" width="400" height="34" fill="#2f9844"/><rect y="160" width="400" height="40" fill="#2f9844"/>
  <rect width="400" height="28" fill="url(#sky)"/>${crowd}<rect y="26" width="400" height="5" fill="#fff"/>`;
}
function bigGoal(){
  return `<polyline points="20,135 44,222 356,222 380,135" fill="none" stroke="#fff" stroke-width="2.5" opacity=".9"/>
  <line x1="0" y1="135" x2="400" y2="135" stroke="#fff" stroke-width="2.5" opacity=".9"/>
  <circle cx="200" cy="203" r="2.5" fill="#fff"/>
  <g id="netG" class="anim"><rect x="96" y="46" width="208" height="89" fill="url(#net)"/><rect x="96" y="46" width="208" height="89" fill="#fff" opacity=".08"/></g>
  <rect x="90" y="40" width="6" height="96" fill="#fff" stroke="#ccc" stroke-width=".6"/>
  <rect x="304" y="40" width="6" height="96" fill="#fff" stroke="#ccc" stroke-width=".6"/>
  <rect x="90" y="40" width="220" height="6" fill="#fff" stroke="#ccc" stroke-width=".6"/>`;
}
function smallGoal(){
  return `<line x1="0" y1="76" x2="400" y2="76" stroke="#fff" stroke-width="2" opacity=".85"/>
  <polyline points="112,76 104,116 296,116 288,76" fill="none" stroke="#fff" stroke-width="2" opacity=".85"/>
  <g id="netG" class="anim"><rect x="160" y="40" width="80" height="36" fill="url(#net)"/></g>
  <rect x="156" y="36" width="4" height="41" fill="#fff"/><rect x="240" y="36" width="4" height="41" fill="#fff"/><rect x="156" y="36" width="88" height="4" fill="#fff"/>`;
}
const yamenBack = () => `<g transform="translate(150 150) scale(.98)"><g id="player" class="anim" style="transform-origin:50% 100%">${playerSVG()}</g></g>`;
const ballAt = (x, y) => `<g transform="translate(${x} ${y})"><g id="ball" class="anim">${ballInner()}</g></g>`;

function buildScene(mode){
  SC.mode = mode; SC.base = '';
  let h = sceneDefs() + sceneField();
  if (mode === 'penalty'){
    h += bigGoal() + `<g transform="translate(170 68)"><g id="keeper" class="anim">${keeperSVG()}</g></g>
      <g transform="translate(132 150) scale(.98)"><g id="player" class="anim" style="transform-origin:50% 100%">${playerSVG()}</g></g>` + ballAt(200, 203);
  } else if (mode === 'keeper'){
    h += bigGoal() + `<g transform="translate(179 64.4) scale(.7)"><g id="player" class="anim" style="transform-origin:50% 50%">${playerFrontSVG(jersey(), { gloves:true })}</g></g>
      <g transform="translate(132 150) scale(.98)"><g id="striker" class="anim" style="transform-origin:50% 100%">${playerSVG(OPP, { name:'', num:'9' })}</g></g>` + ballAt(200, 203);
  } else if (mode === 'pass'){
    h += smallGoal();
    [7, 10, 11].forEach((n, i) => {
      h += `<ellipse id="mk${i}" cx="${SC.cols[i]}" cy="140" rx="17" ry="5" fill="${MK[i]}" opacity=".95"/>
        <g id="mateW${i}" transform="translate(${SC.cols[i] - 18.6} 79.2) scale(.62)"><g id="mate${i}" class="anim" style="transform-origin:50% 100%">${playerFrontSVG(jersey(), { num:String(n) })}</g></g>`;
    });
    h += yamenBack() + ballAt(205, 236);
  } else if (mode === 'dribble'){
    h += smallGoal();
    for (let i = 0; i < 3; i++){
      h += `<g id="gate${i}" transform="translate(${SC.cols[i]} 0)"><ellipse cx="0" cy="137" rx="11" ry="4" fill="${MK[i]}"/>
        <g id="cone${i}" class="anim" style="transform-origin:50% 100%"><polygon points="-27,139 -20,119 -13,139" fill="#ff6d00" stroke="#fff" stroke-width="1.2"/><rect x="-25" y="128" width="10" height="3" fill="#fff"/>
        <polygon points="13,139 20,119 27,139" fill="#ff6d00" stroke="#fff" stroke-width="1.2"/><rect x="15" y="128" width="10" height="3" fill="#fff"/></g></g>`;
    }
    h += yamenBack() + ballAt(205, 236);
  } else { // juggle
    h += `<circle cx="82" cy="128" r="44" fill="#fff" opacity=".92"/><text x="82" y="104" font-size="13" font-weight="900" text-anchor="middle" fill="#7d0000" font-family="Tahoma,Arial">العدّاد</text><text id="jc" x="82" y="152" font-size="50" font-weight="900" text-anchor="middle" fill="#c40000" font-family="Tahoma,Arial"></text>
      <g transform="translate(158 100) scale(1.4)"><g id="player" class="anim" style="transform-origin:50% 100%">${playerSVG()}</g></g>` + ballAt(214, 226);
  }
  $('#scene').innerHTML = h;
}

/* line the team-mates / gates up with the 3 answer buttons below the pitch */
function colX(i){
  const btn = document.querySelectorAll('#opts .opt')[i], svg = $('#scene');
  const fallback = [335, 200, 65][i];
  try {
    const m = svg.getScreenCTM(); if (!btn || !m) return fallback;
    const r = btn.getBoundingClientRect(); if (!r.width) return fallback;
    const pt = svg.createSVGPoint(); pt.x = r.left + r.width / 2; pt.y = r.top;
    return Math.max(45, Math.min(355, pt.matrixTransform(m.inverse()).x));
  } catch(e){ return fallback; }
}
function layoutColumns(){
  if (SC.mode !== 'pass' && SC.mode !== 'dribble') return;
  for (let i = 0; i < 3; i++){
    const x = colX(i); SC.cols[i] = x;
    if (SC.mode === 'pass'){ const w = $('#mateW' + i), mk = $('#mk' + i); if (w) w.setAttribute('transform', `translate(${x - 18.6} 79.2) scale(.62)`); if (mk) mk.setAttribute('cx', x); }
    else { const g = $('#gate' + i); if (g) g.setAttribute('transform', `translate(${x} 0)`); }
  }
}
window.addEventListener('resize', () => { if (G && !G.busy) layoutColumns(); });

function startStage(i){
  if (timeIsUp()){ showRest(); return; }
  applyJersey();
  G = { stage:i, qs:makeRound(i), modes:roundModes(), i:0, results:[], busy:false, starsWon:0 };
  SC.mode = null;
  show('play'); renderDots();
  Snd.whistle();
  showQuestion(false);
  Speech.say([{ t:`يلا بينا على ${STAGES[i].name}!` }, { t:MODES[G.modes[0]].say }]).then(() => { if (G && G.i === 0 && current === 'play' && !G.busy) askCurrent(); });
}

function renderDots(){
  const d = $('#dots'); d.innerHTML = '';
  for (let k = 0; k < 10; k++){
    const i = document.createElement('i');
    const r = G.results[k];
    if (r === 'first') { i.className = 'goal'; i.textContent = '⚽'; }
    else if (r === 'later') { i.className = 'goal'; i.textContent = '✔'; }
    else if (k === G.i) i.className = 'cur';
    d.appendChild(i);
  }
}

let modeBannerTimer = 0;
function showQuestion(speak){
  const q = G.qs[G.i], mode = G.modes[G.i], isNew = mode !== SC.mode;
  q.tried = false;
  if (isNew) buildScene(mode);
  $('#qtext').innerHTML = q.text;
  $('#qvisual').innerHTML = q.visual || '';
  const box = $('#opts'); box.innerHTML = '';
  q.options.forEach(o => {
    const b = document.createElement('button');
    b.className = 'opt'; b.innerHTML = o.html; b.dataset.ok = o.ok ? '1' : '0';
    b.addEventListener('click', () => answer(b, o));
    box.appendChild(b);
  });
  layoutColumns();
  renderDots();
  if (isNew){
    banner(MODES[mode].title, 'mode');
    clearTimeout(modeBannerTimer);
    modeBannerTimer = setTimeout(() => { const b = $('#banner'); if (b.dataset.tag === 'mode'){ b.className = ''; b.innerHTML = ''; b.dataset.tag = ''; } }, 1800);
  }
  if (speak !== false) Speech.say(isNew ? [{ t:MODES[mode].say }].concat(toParts(q.say)) : q.say);
}
function askCurrent(){ if (G) return Speech.say(G.qs[G.i].say); }
$('#replayBtn').addEventListener('click', () => { Snd.init(); askCurrent(); });
$('#quitBtn').addEventListener('click', () => { Snd.tap(); G = null; show('home'); });

function anim(el, frames, opts){ try { return el && el.animate(frames, Object.assign({ fill:'forwards', easing:'ease-out' }, opts)); } catch(e){ return null; } }
function resetScene(){
  const sc = $('#scene');
  sc.querySelectorAll('.anim').forEach(el => { if (el.getAnimations) el.getAnimations().forEach(a => a.cancel()); });
  sc.querySelectorAll('.yp').forEach(p => p.classList.remove('cheer', 'plane'));
  const pl = $('#player'); if (pl) pl.style.transformOrigin = SC.mode === 'keeper' ? '50% 50%' : '50% 100%';
  const jc = $('#jc'); if (jc) jc.textContent = '';
  SC.base = '';
  const b = $('#banner'); b.className = ''; b.innerHTML = ''; b.dataset.tag = '';
}
function netShake(){ anim($('#netG'), [{ transform:'scale(1)' }, { transform:'scale(1.04,1.06)' }, { transform:'scale(.98)' }, { transform:'scale(1)' }], { duration:450 }); }

/* ---------- 1. penalty ---------- */
async function playPenalty(goal){
  const ball = $('#ball'), keeper = $('#keeper'), player = $('#player');
  const sp = pick([{x:124,y:68},{x:276,y:68},{x:122,y:114},{x:278,y:114},{x:200,y:62}]);
  anim(player, [{ transform:'translate(0,0)' }, { transform:'translate(26px,-22px) scale(.95)' }], { duration:320, easing:'ease-in' });
  await sleep(300);
  Snd.kick();
  const dx = sp.x - 200, dy = sp.y - 203;
  SC.base = 'translate(26px,-22px) scale(.95)';
  if (goal){
    const side = sp.x === 200 ? (Math.random() < .5 ? -1 : 1) : (sp.x < 200 ? 1 : -1);
    anim(keeper, [{ transform:'translate(0,0) rotate(0)' }, { transform:`translate(${side * 62}px,14px) rotate(${side * 80}deg)` }], { duration:480 });
    anim(ball, [{ transform:'translate(0,0) scale(1) rotate(0)' }, { transform:`translate(${dx}px,${dy}px) scale(.6) rotate(540deg)` }], { duration:560, easing:'cubic-bezier(.2,.7,.4,1)' });
    await sleep(560);
    netShake(); Snd.cheer();
  } else {
    const side = sp.x === 200 ? 0 : (sp.x < 200 ? -1 : 1);
    anim(keeper, [{ transform:'translate(0,0) rotate(0)' }, { transform:`translate(${side * 58}px,${side ? 10 : -14}px) rotate(${side * 70}deg)` }], { duration:420 });
    const hx = side * 66, hy = (side ? 92 : 64) - 203;
    anim(ball, [{ transform:'translate(0,0) scale(1)', offset:0 }, { transform:`translate(${hx}px,${hy}px) scale(.65)`, offset:.7 }, { transform:`translate(${hx * .7}px,${hy * .55}px) scale(.75)`, offset:1 }], { duration:700 });
    await sleep(440); Snd.save(); await sleep(260);
  }
}

/* ---------- 2. Yamen in goal ---------- */
async function playKeeper(save){
  const ball = $('#ball'), me = $('#player'), st = $('#striker');
  anim(st, [{ transform:'translate(0,0)' }, { transform:'translate(26px,-22px) scale(.95)' }], { duration:320, easing:'ease-in' });
  await sleep(300);
  Snd.kick();
  if (save){
    const sp = pick([{x:132,y:80},{x:268,y:80},{x:136,y:112},{x:264,y:112},{x:200,y:72}]);
    const side = sp.x < 200 ? -1 : (sp.x > 200 ? 1 : 0);
    const kdx = (sp.x - 200) / .7, kdy = (sp.y - 99) / .7;   // keeper group is drawn at scale .7
    me.querySelector('.yp').classList.add('cheer');
    anim(me, [{ transform:'translate(0,0) rotate(0)' }, { transform:`translate(${kdx}px,${kdy}px) rotate(${side * 55}deg)` }], { duration:400 });
    anim(ball, [{ transform:'translate(0,0) scale(1)' }, { transform:`translate(${sp.x - 200}px,${sp.y - 203 - 14}px) scale(.7)` }], { duration:440, easing:'cubic-bezier(.2,.7,.4,1)' });
    await sleep(440);
    Snd.save(); Snd.cheer();
    SC.base = `translate(${kdx}px,${kdy}px)`;
  } else {
    const side = pick([-1, 1]), px = side < 0 ? 98 : 302;
    anim(me, [{ transform:'translate(0,0) rotate(0)' }, { transform:`translate(${-side * 50}px,14px) rotate(${-side * 55}deg)` }], { duration:420 });
    anim(ball, [{ transform:'translate(0,0) scale(1)', offset:0 }, { transform:`translate(${px - 200}px,${70 - 203}px) scale(.7)`, offset:.55 },
      { transform:`translate(${px - 200 + side * 50}px,${150 - 203}px) scale(.85)`, offset:1 }], { duration:820 });
    await sleep(450); Snd.clang(); await sleep(370);
  }
}

/* ---------- 3. pass to the team-mate standing at the answer ---------- */
async function playPass(ok, idx){
  const ball = $('#ball'), me = $('#player'), x = SC.cols[idx], mate = $('#mate' + idx);
  anim(me, [{ transform:'translate(0,0)' }, { transform:'translate(18px,-12px)' }], { duration:280, easing:'ease-in' });
  await sleep(260);
  Snd.kick();
  SC.base = 'translate(18px,-12px)';
  const tx = x - 205, ty = 134 - 236;

    anim(ball, [{ transform:'translate(0,0) scale(1)' }, { transform:`translate(${tx}px,${ty}px) scale(.75)` }], { duration:520 });
    await sleep(520);
    if (mate){ mate.querySelector('.yp').classList.add('cheer'); anim(mate, [{ transform:'translateY(0)' }, { transform:'translateY(-14px)' }, { transform:'translateY(0)' }], { duration:400, fill:'none' }); }
    await sleep(150);
    Snd.kick();
    anim(ball, [{ transform:`translate(${tx}px,${ty}px) scale(.75)` }, { transform:`translate(${200 - 205}px,${56 - 236}px) scale(.55)` }], { duration:420, easing:'cubic-bezier(.2,.7,.4,1)' });
    await sleep(420);
    netShake(); Snd.cheer();
  } else {
    anim(ball, [{ transform:'translate(0,0) scale(1)', offset:0 }, { transform:`translate(${tx * .55}px,${ty * .55}px) scale(.85)`, offset:.55 },
      { transform:`translate(${tx * .15}px,${ty * .15}px) scale(.97)`, offset:1 }], { duration:900, easing:'ease-out' });
    if (mate) anim(mate, [{ transform:'rotate(0)' }, { transform:'rotate(-6deg)' }, { transform:'rotate(6deg)' }, { transform:'rotate(0)' }], { duration:700, fill:'none' });
    await sleep(500); Snd.save(); await sleep(400);
  }
}

/* ---------- 4. dribble through the gate at the answer ---------- */
async function playDribble(ok, idx){
  const ball = $('#ball'), me = $('#player'), x = SC.cols[idx];
  const steps = n => { for (let k = 0; k < n; k++) setTimeout(() => Snd.bounce(), k * 230); };
  if (ok){
    const end = 'translate(15px,-121px) scale(.7)';
    anim(me, [{ transform:'translate(0,0) scale(1)' }, { transform:`translate(${x - 185}px,${140 - 246 + 18}px) scale(.8)`, offset:.55 }, { transform:end }], { duration:1100, easing:'ease-in-out' });
    anim(ball, [{ transform:'translate(0,0) scale(1)' }, { transform:`translate(${x - 200}px,${142 - 236}px) scale(.8)`, offset:.55 }, { transform:'translate(5px,-124px) scale(.7)' }], { duration:1100, easing:'ease-in-out' });
    steps(5);
    await sleep(1100);
    Snd.kick();
    anim(ball, [{ transform:'translate(5px,-124px) scale(.7)' }, { transform:`translate(-5px,${56 - 236}px) scale(.5)` }], { duration:360 });
    await sleep(360);
    netShake(); Snd.cheer();
    SC.base = end;
  } else {
    const cone = $('#cone' + idx);
    anim(me, [{ transform:'translate(0,0) scale(1)' }, { transform:`translate(${(x - 185) * .5}px,-45px) scale(.9)`, offset:.5 }, { transform:'translate(0,0) scale(1)' }], { duration:1100, easing:'ease-in-out' });
    anim(ball, [{ transform:'translate(0,0) scale(1)' }, { transform:`translate(${x - 205 + 14}px,${136 - 236}px) scale(.8)`, offset:.5 }, { transform:'translate(0,0) scale(1)' }], { duration:1100, easing:'ease-in-out' });
    steps(2);
    await sleep(550); Snd.save();
    anim(cone, [{ transform:'rotate(0)' }, { transform:'rotate(-10deg)' }, { transform:'rotate(8deg)' }, { transform:'rotate(0)' }], { duration:500, fill:'none' });
    await sleep(550);
  }
}

/* ---------- 5. keepy-ups: juggle as many times as the numeric answer ---------- */
function juggleCount(q){
  const right = q.options.find(o => o.ok), v = right && right.v;
  return (typeof v === 'number' && v >= 1 && v <= 20) ? v : 5;
}
async function playJuggle(ok, q){
  const ball = $('#ball'), me = $('#player'), jc = $('#jc');
  if (ok){
    const n = Math.max(1, juggleCount(q)), per = Math.max(180, Math.min(380, 3800 / n));
    for (let k = 1; k <= n; k++){
      if (!G || SC.mode !== 'juggle') return;
      Snd.bounce();
      anim(ball, [{ transform:'translateY(0)' }, { transform:'translateY(-96px)', easing:'ease-in' }, { transform:'translateY(0)' }], { duration:per, easing:'ease-out', fill:'none' });
      anim(me, [{ transform:'translateY(0)' }, { transform:'translateY(-3px)' }, { transform:'translateY(0)' }], { duration:per * .5, fill:'none' });
      jc.textContent = fmt(k);
      anim(jc, [{ transform:'scale(1.25)' }, { transform:'scale(1)' }], { duration:200, fill:'none' });
      await sleep(per);
    }
    SC.jug = n; Snd.cheer();
  } else {
    Snd.bounce();
    anim(ball, [{ transform:'translate(0,0)' }, { transform:'translate(0,-90px)', offset:.3 }, { transform:'translate(60px,8px)', offset:.65 }, { transform:'translate(0,0)', offset:1 }], { duration:1200, easing:'ease-in-out' });
    await sleep(400); Snd.save(); await sleep(800);
  }
}

function play(mode, ok, idx, q){
  resetScene();
  if (mode === 'keeper') return playKeeper(ok);
  if (mode === 'pass') return playPass(ok, idx);
  if (mode === 'dribble') return playDribble(ok, idx);
  if (mode === 'juggle') return playJuggle(ok, q);
  return playPenalty(ok);
}

async function celebrate(){
  const p = $('#player'); if (!p) return;
  const yp = p.querySelector('.yp'), type = S.equip.celeb, back = SC.base || '';
  if (type === 'plane'){
    yp.classList.add('plane');
    anim(p, [{ transform:back + ' rotate(0)' }, { transform:back + ' translateX(-14px) rotate(-18deg)' }, { transform:back + ' translateX(14px) rotate(18deg)' }, { transform:back + ' translateX(-14px) rotate(-18deg)' }, { transform:back + ' rotate(0)' }], { duration:1500, easing:'ease-in-out' });
  } else if (type === 'spin'){
    yp.classList.add('cheer'); p.style.transformOrigin = '50% 60%';
    anim(p, [{ transform:back + ' translateY(0) rotate(0)' }, { transform:back + ' translateY(-28px) rotate(180deg)' }, { transform:back + ' translateY(0) rotate(360deg)' }], { duration:900, easing:'ease-in-out' });
  } else if (type === 'dance'){
    yp.classList.add('cheer');
    anim(p, [{ transform:back }, { transform:back + ' translateX(-10px) scale(1.08,.9)' }, { transform:back + ' translateX(10px) scale(.92,1.08)' }, { transform:back + ' translateX(-10px) scale(1.08,.9)' }, { transform:back + ' translateX(10px) scale(.92,1.08)' }, { transform:back }], { duration:1400, easing:'ease-in-out' });
  } else {
    yp.classList.add('cheer');
    anim(p, [{ transform:back + ' translateY(0)' }, { transform:back + ' translateY(-30px)' }, { transform:back + ' translateY(0)' }, { transform:back + ' translateY(-30px)' }, { transform:back + ' translateY(0)' }], { duration:1100, easing:'ease-in-out' });
    if (type === 'fire') fireworks();
  }
  confetti(type === 'fire' ? 50 : 34);
}

function confetti(n){
  const fx = $('#fx'), cols = ['#d50000', '#fff', '#ffc400', '#ff5252'];
  for (let i = 0; i < n; i++){
    const e = document.createElement('i');
    const s = 6 + rnd(8);
    e.style.cssText = `width:${s}px;height:${s * 1.6}px;background:${pick(cols)};left:${rnd(100)}vw;top:-20px;box-shadow:0 0 1px #0004`;
    fx.appendChild(e);
    const a = anim(e, [{ transform:'translate(0,0) rotate(0)' }, { transform:`translate(${rnd(120) - 60}px,${window.innerHeight + 40}px) rotate(${rnd(720)}deg)` }], { duration:1400 + rnd(1200), easing:'ease-in', delay:rnd(300) });
    if (a) a.onfinish = () => e.remove(); else setTimeout(() => e.remove(), 2000);
  }
}
function fireworks(){
  const fx = $('#fx');
  for (let b = 0; b < 3; b++){
    const cx = 15 + rnd(70), cy = 10 + rnd(30), col = pick(['#ffc400', '#ff5252', '#fff', '#40c4ff']);
    for (let i = 0; i < 18; i++){
      const e = document.createElement('i'), ang = i / 18 * Math.PI * 2, r = 70 + rnd(40);
      e.style.cssText = `width:7px;height:7px;border-radius:50%;background:${col};left:${cx}vw;top:${cy}vh`;
      fx.appendChild(e);
      const a = anim(e, [{ transform:'translate(0,0) scale(1)', opacity:1 }, { transform:`translate(${Math.cos(ang) * r}px,${Math.sin(ang) * r}px) scale(.4)`, opacity:0 }], { duration:1000, delay:b * 350 });
      if (a) a.onfinish = () => e.remove(); else setTimeout(() => e.remove(), 2000);
    }
  }
}

function banner(html, cls){ const b = $('#banner'); b.className = ''; void b.offsetWidth; b.innerHTML = html; b.dataset.tag = cls || ''; b.className = 'show ' + (cls || ''); }

function stat(sub){ return S.stats[sub] || (S.stats[sub] = { q:0, f:0 }); }

async function answer(btn, o){
  if (!G || G.busy || btn.disabled) return;
  G.busy = true; Snd.init();
  const q = G.qs[G.i], mode = G.modes[G.i];
  const idx = [...document.querySelectorAll('#opts .opt')].indexOf(btn);
  Speech.stop();
  document.querySelectorAll('.opt').forEach(b => b.style.pointerEvents = 'none');
  if (o.ok){
    btn.classList.add('right');
    await play(mode, true, idx, q);
    if (!G) return;
    let txt, say;
    if (mode === 'juggle'){ txt = `نطّطتها ${fmt(SC.jug)} مرة! 🤹`; say = `نططتها ${SC.jug} مرة! الله عليك`; }
    else { const M = MODES[mode], k = rnd(M.win.length); txt = M.win[k]; say = M.winSay[k]; }
    banner(txt + (q.reveal ? `<span class="rev">${q.reveal}</span>` : ''));
    celebrate();
    const st = stat(q.sub); st.q++;
    if (!q.tried){ st.f++; addStars(1); G.results[G.i] = 'first'; G.starsWon++; } else G.results[G.i] = 'later';
    save(); renderDots();
    await Promise.all([sleep(q.after ? 2600 : 2100), Speech.say([{ t:say }].concat(toParts(q.after)))]);
    if (!G) return;
    resetScene(); G.i++;
    if (G.i >= 10){ finishRound(); return; }
    if (timeIsUp()){ G.busy = false; showRest(); return; }
    showQuestion();
    G.busy = false;
  } else {
    if (!q.tried){
      q.tried = true;
      const m = S.mistakes[q.label] || (S.mistakes[q.label] = { n:0, s:q.sub });
      m.n++; save();
    }
    await play(mode, false, idx, q);
    if (!G) return;
    banner(MODES[mode].miss, 'save');
    btn.disabled = true;
    await Promise.all([sleep(1300), Speech.say('قربت! جرب تاني')]);
    if (!G) return;
    resetScene();
    document.querySelectorAll('.opt').forEach(b => b.style.pointerEvents = '');
    G.busy = false;
  }
}

function finishRound(){
  const st = G.stage;
  S.trophies.push({ s:st, d:Date.now(), f:G.starsWon });
  addStars(3);
  let lvMsg = '';
  if (S.settings.diff === 'auto'){
    const id = STAGES[st].id, lv = S.level[id] || 2;
    if (G.starsWon >= 9 && lv < 3){ S.level[id] = lv + 1; lvMsg = `🚀 طلعت ${'⭐'.repeat(lv + 1)} المستوى ال${LEVEL_NAMES[lv + 1]}!`; }
    else if (G.starsWon <= 4 && lv > 1){ S.level[id] = lv - 1; }
  }
  save();
  $('#endCup').innerHTML = trophySVG(STAGE_COLORS[st]);
  $('#endTitle').textContent = `كسبت كاس ${STAGES[st].name}! 🏆`;
  $('#endStars').innerHTML = `خلّصت الـ ${fmt(10)} تحديات! ⚽🧤🤹<br>⭐ +${fmt(G.starsWon + 3)} نجمة` + (lvMsg ? `<br><b>${lvMsg}</b>` : '');
  $('#endModal').classList.add('show');
  Snd.fanfare(); confetti(60);
  Speech.say(`مبروك يا يامن! كسبت كاس ${STAGES[st].name}. الكاس راح دولاب البطولات` + (lvMsg ? '. وطلعت المستوى الأصعب! برافو' : ''));
  G.busy = false;
}
$('#endAgain').addEventListener('click', () => { Snd.tap(); $('#endModal').classList.remove('show'); const s = G ? G.stage : 0; startStage(s); });
$('#endHome').addEventListener('click', () => { Snd.tap(); $('#endModal').classList.remove('show'); G = null; show('home'); });

/* ---------- stars & unlocks ---------- */
let toastQ = [], toastBusy = false;
function addStars(n){
  const before = S.stars; S.stars += n;
  const all = [].concat(JERSEYS.map(x => ['فانلة جديدة', x]), BALLS.map(x => ['كورة جديدة', x]), CELEBS.map(x => ['احتفال جديد', x]));
  all.forEach(([kind, it]) => { if (it.need > before && it.need <= S.stars) toastQ.push(`🎉 فتحت ${kind}: ${it.name}!<br><small>روح غرفة اللبس 👕</small>`); });
  runToasts();
}
async function runToasts(){
  if (toastBusy || !toastQ.length) return;
  toastBusy = true;
  while (toastQ.length){
    const t = $('#toast'); t.innerHTML = toastQ.shift(); t.classList.add('show'); Snd.sparkle();
    await sleep(2600); t.classList.remove('show'); await sleep(400);
  }
  toastBusy = false;
}

/* =========================================================
   CABINET
   ========================================================= */
function renderCabinet(){
  const body = $('#cabBody'); body.innerHTML = '';
  STAGES.forEach((st, i) => {
    const n = cupsFor(i), sh = document.createElement('div'); sh.className = 'shelf';
    let cups = '';
    for (let k = 0; k < Math.min(n, 12); k++) cups += trophySVG(STAGE_COLORS[i]);
    sh.innerHTML = `<h3>${st.name}</h3><div class="cups">${n ? cups + (n > 12 ? `<span class="count">+${fmt(n - 12)}</span>` : '') + `<span class="count">× ${fmt(n)}</span>` : '<span class="empty">لسه مفيش كاس هنا… يلا نلعب ونجيبه! ⚽</span>'}</div>`;
    body.appendChild(sh);
  });
}

/* =========================================================
   LOCKER (unlockables)
   ========================================================= */
function renderLocker(){
  applyJersey();
  $('#lStars').textContent = fmt(S.stars);
  $('#lockerHero').innerHTML = `<svg viewBox="-6 -8 72 110">${playerSVG()}</svg><svg viewBox="-12 -12 24 24" style="width:60px;height:60px;align-self:flex-end">${ballInner()}</svg>`;
  const body = $('#lockerBody'); body.innerHTML = '';
  const section = (title, list, kind, prev) => {
    const h = document.createElement('h3'); h.textContent = title; body.appendChild(h);
    const grid = document.createElement('div'); grid.className = 'items';
    list.forEach(it => {
      const locked = S.stars < it.need, on = S.equip[kind] === it.id;
      const b = document.createElement('button');
      b.className = 'item' + (on ? ' on' : '') + (locked ? ' locked' : '');
      b.innerHTML = prev(it) + `<span>${it.name}</span>` + (locked ? `<span class="lock">🔒<small>⭐ ${fmt(it.need)}</small></span>` : '');
      b.addEventListener('click', () => {
        Snd.init();
        if (locked){ Snd.tap(); Speech.say(`محتاج ${it.need} نجمة عشان تفتحها. كمّل لعب يا بطل!`); return; }
        S.equip[kind] = it.id; save(); Snd.sparkle(); renderLocker();
        if (kind === 'celeb'){ const g = $('#lockerHero .yp'); g.classList.add(it.id === 'plane' ? 'plane' : 'cheer'); setTimeout(() => g.classList.remove('cheer', 'plane'), 1300); if (it.id === 'fire') fireworks(); confetti(20); }
      });
      grid.appendChild(b);
    });
    body.appendChild(grid);
  };
  section('👕 الفانلة', JERSEYS, 'jersey', it => `<svg viewBox="-6 -8 72 110">${playerSVG(it)}</svg>`);
  section('⚽ الكورة', BALLS, 'ball', it => `<span class="ball-prev">${ballSVG(it)}</span>`);
  section('🎉 الاحتفال', CELEBS, 'celeb', it => `<span class="em">${it.em}</span>`);
}

/* =========================================================
   PARENT GATE + PAGE
   ========================================================= */
let gateCb = null, gateAns = 0;
function gate(cb){
  gateCb = cb;
  const a = randInt(6, 9), b = randInt(4, 9); gateAns = a * b;
  $('#gateQ').textContent = `${a} × ${b} = ?`;
  $('#gateIn').value = ''; $('#gateErr').textContent = '';
  $('#gate').classList.add('show');
  setTimeout(() => $('#gateIn').focus(), 50);
}
function gateSubmit(){
  const v = parseInt($('#gateIn').value.replace(/[٠-٩]/g, d => AR_DIG.indexOf(d)), 10);
  if (v === gateAns){ $('#gate').classList.remove('show'); const cb = gateCb; gateCb = null; if (cb) cb(); }
  else { $('#gateErr').textContent = 'الإجابة مش صح، جرب تاني'; $('#gateIn').value = ''; }
}
$('#gateOk').addEventListener('click', gateSubmit);
$('#gateIn').addEventListener('keydown', e => { if (e.key === 'Enter') gateSubmit(); });
$('#gateNo').addEventListener('click', () => { $('#gate').classList.remove('show'); gateCb = null; });

const SUB_NAMES = { ar:'الحروف العربي', en:'الحروف الإنجليزي', num:'الأرقام', math:'الحساب', shape:'الأشكال والألوان' };
function renderParent(){
  const body = $('#parentBody');
  const mins = Math.floor(S.time.sec / 60);
  const limitTotal = S.settings.limit ? S.settings.limit + Math.round(S.time.bonus / 60) : 0;
  let html = `<div class="card"><h3>📊 ملخص</h3><div class="kv">
      <div>🏆 الكؤوس<br><b>${S.trophies.length}</b></div>
      <div>⭐ النجوم<br><b>${S.stars}</b></div>
      <div>⏱️ لعب النهارده<br><b>${mins}</b> دقيقة${limitTotal ? ` من ${limitTotal}` : ''}</div>
    </div></div>`;
  html += `<div class="card"><h3>🏟️ الملاعب اللي خلصها</h3>`;
  STAGES.forEach((st, i) => { const n = cupsFor(i); html += `<div class="stat"><span class="nm">${st.short}</span><span>${n ? `✅ خلّصه ${n} مرة` : '— لسه'}</span></div>`; });
  html += `</div><div class="card"><h3>✅ نسبة الإجابة الصح من أول مرة</h3>`;
  STAGES.forEach(st => {
    const s = S.stats[st.id];
    const pc = s && s.q ? Math.round(s.f / s.q * 100) : null;
    html += `<div class="stat"><span class="nm">${st.short}</span><span class="bar"><b style="width:${pc || 0}%"></b></span><span class="pc">${pc === null ? '—' : pc + '% (' + s.q + ')'}</span></div>`;
  });
  html += `<p class="note">الرقم بين القوسين = عدد الأسئلة اللي جاوبها في المادة.</p></div>`;
  const ms = Object.entries(S.mistakes).sort((a, b) => b[1].n - a[1].n).slice(0, 15);
  html += `<div class="card"><h3>⚠️ الحاجات اللي بيغلط فيها كتير</h3>`;
  if (!ms.length) html += `<p class="note">لسه مفيش أخطاء متسجلة 👏</p>`;
  else {
    STAGES.forEach(st => {
      const list = ms.filter(m => m[1].s === st.id);
      if (list.length) html += `<p style="margin:8px 0 4px;font-weight:700">${st.short}:</p><div class="mist">${list.map(m => `<span><bdi>${esc(m[0])}</bdi> — ${m[1].n} مرة</span>`).join('')}</div>`;
    });
  }
  html += `</div>`;
  const lim = [0, 10, 15, 20, 30, 45, 60].map(v => `<option value="${v}" ${S.settings.limit === v ? 'selected' : ''}>${v ? v + ' دقيقة' : 'من غير حد'}</option>`).join('');
  const dsel = [['auto', 'تلقائي (بيعلى وينزل مع مستوى يامن)'], [1, '⭐ سهل'], [2, '⭐⭐ متوسط'], [3, '⭐⭐⭐ صعب']]
    .map(([v, t]) => `<option value="${v}" ${String(S.settings.diff) === String(v) ? 'selected' : ''}>${t}</option>`).join('');
  html += `<div class="card"><h3>🎯 مستوى الأسئلة</h3>
    <div class="row" style="justify-content:flex-start"><label for="diffSel">المستوى:</label><select id="diffSel">${dsel}</select></div>
    ${STAGES.map((st, i) => `<div class="stat"><span class="nm">${st.short}</span><span>${'⭐'.repeat(levelFor(i))} ${LEVEL_NAMES[levelFor(i)]}</span></div>`).join('')}
    <p class="note">في "تلقائي": لو جاوب ٩ من ١٠ صح من أول مرة بيطلع مستوى، ولو ٤ أو أقل بينزل مستوى. المستوى الصعب فيه: الحركات والمدود وقراءة كلمات، ترتيب الحروف الإنجليزي وقراءة كلمات، أرقام لحد ٩٩ وعشرات وآحاد، مسائل كلامية والرقم الناقص، والأنماط وخلط الألوان.</p></div>`;
  html += `<div class="card"><h3>⏱️ وقت اللعب</h3>
    <div class="row" style="justify-content:flex-start"><label for="limitSel">الحد اليومي:</label><select id="limitSel">${lim}</select></div>
    <div class="row" style="justify-content:flex-start;margin-top:10px">
      <button class="btn small" id="addTime">زوّد ١٠ دقايق النهارده</button>
      <button class="btn small gray" id="resetTime">صفّر عداد النهارده</button>
    </div>
    <p class="note">بعد ما الوقت يخلص بتظهر رسالة "وقت الراحة يا كابتن 💪". العداد بيتصفر لوحده كل يوم.</p></div>`;
  const voiceOk = Speech.supported && Speech.ar;
  html += `<div class="card"><h3>⚙️ إعدادات</h3>
    <div class="row" style="justify-content:flex-start"><label for="digSel">شكل الأرقام:</label>
      <select id="digSel"><option value="ar" ${S.settings.digits === 'ar' ? 'selected' : ''}>عربي (١ ٢ ٣)</option><option value="en" ${S.settings.digits === 'en' ? 'selected' : ''}>إنجليزي (1 2 3)</option></select></div>
    <div class="row" style="justify-content:flex-start;margin-top:10px">
      <label><input type="checkbox" id="voiceChk" ${S.settings.voice ? 'checked' : ''}> قراءة الأسئلة بصوت عالي</label>
      <label><input type="checkbox" id="soundChk" ${S.settings.sound ? 'checked' : ''}> المؤثرات الصوتية</label>
    </div>
    <div class="row" style="justify-content:flex-start;margin-top:10px"><button class="btn small white" id="testVoice">🔊 جرّب الصوت العربي</button></div>
    ${!Speech.supported ? `<p class="warn">المتصفح ده مش بيدعم القراءة بالصوت. استخدم Google Chrome.</p>` :
      voiceOk ? `<p class="note">الصوت العربي المستخدم: ${esc(Speech.ar.name)} (${esc(Speech.ar.lang)})</p>` :
      `<p class="warn">مش لاقي صوت عربي متسطب على الجهاز. على أندرويد: الإعدادات ← اللغة والإدخال ← تحويل النص إلى كلام ← Google ← ثبّت "العربية". اللعبة هتحاول تقرا بالعربي برضه.</p>`}
  </div>`;
  html += `<div class="card"><h3>🗑️ البداية من الأول</h3><p class="note">الإصدار ٣ (٥ أنواع لعب، ٣ مستويات)</p><p class="note">ده هيمسح الكؤوس والنجوم والإحصائيات واللبس اللي اتفتح (الإعدادات بتفضل زي ما هي).</p>
    <button class="btn small" id="resetAll" style="background:#b71c1c">امسح التقدم وابدأ من الأول</button></div>`;
  body.innerHTML = html;
  $('#limitSel').addEventListener('change', e => { S.settings.limit = +e.target.value; save(); renderParent(); });
  $('#diffSel').addEventListener('change', e => { const v = e.target.value; S.settings.diff = v === 'auto' ? 'auto' : +v; save(); renderParent(); });
  $('#digSel').addEventListener('change', e => { S.settings.digits = e.target.value; save(); renderParent(); });
  $('#voiceChk').addEventListener('change', e => { S.settings.voice = e.target.checked; save(); });
  $('#soundChk').addEventListener('change', e => { S.settings.sound = e.target.checked; save(); });
  $('#testVoice').addEventListener('click', () => { Snd.init(); Speech.pickVoices(); Speech.say('أهلاً يا يامن! جاوب صح وشوط جون. واحد، اتنين، تلاتة'); setTimeout(renderParent, 800); });
  $('#addTime').addEventListener('click', () => { S.time.bonus += 600; save(); hideRest(); renderParent(); });
  $('#resetTime').addEventListener('click', () => { S.time.sec = 0; S.time.bonus = 0; save(); hideRest(); renderParent(); });
  let resetArmed = 0;
  $('#resetAll').addEventListener('click', e => {
    // two taps instead of confirm(): some in-app browsers never show dialogs
    if (Date.now() - resetArmed > 6000){ resetArmed = Date.now(); e.currentTarget.textContent = 'متأكد؟ اضغط تاني عشان تمسح كل حاجة'; return; }
    const keep = S.settings, t = S.time; S = DEFAULT(); S.settings = keep; S.time = t; save(); applyJersey(); renderParent();
  });
}

/* =========================================================
   PLAY-TIME LIMIT
   ========================================================= */
function timeIsUp(){ return S.settings.limit > 0 && S.time.sec >= S.settings.limit * 60 + S.time.bonus; }
function showRest(){
  if ($('#rest').classList.contains('show')) return;
  $('#rest').classList.add('show');
  Speech.say('وقت الراحة يا كابتن! لعبت كتير النهارده. اشرب مية ونكمل بكرة');
}
function hideRest(){ $('#rest').classList.remove('show'); }
$('#restParent').addEventListener('click', () => gate(() => { hideRest(); show('parent'); }));
let tick = 0;
setInterval(() => {
  if (S.time.date !== todayKey()){ S.time = { date:todayKey(), sec:0, bonus:0 }; save(); }
  if (document.visibilityState !== 'visible' || current === 'parent' || current === 'intro' || $('#rest').classList.contains('show')) return;
  S.time.sec++;
  if (++tick % 10 === 0) save();
  // during a shot we wait until the answer animation finishes (handled in answer())
  if (timeIsUp() && !(G && G.busy && current === 'play')){ save(); showRest(); }
}, 1000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState !== 'visible') { save(); Speech.stop(); } });

applyJersey();

/* optional offline support: works when sw.js is uploaded next to this file (Netlify) */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { updateViaCache:'none' }).then(r => r.update()).catch(() => {});
  });
  // when a new version takes over, reload once so it shows immediately (only before play starts)
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloaded || current === 'play') return; reloaded = true; location.reload();
  });
}

/* test hook (read-only access for automated checks) */
window.__YC = { levelFor, LEVEL_NAMES, game: () => G, scene: SC, GEN, STAGES, makeRound, AR, EN_WORDS, OBJ_COLORS, REAL_SHAPES, COLORS, SHAPES, state: () => S };
})();
</script>
